        <button onclick="weather()" class="btn btn-success w-100 mt-3">Search</button>

<script>
    const weather = async () => {
        const place = document.getElementById("place").value
        console.log(place);

        if (place) {
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${place}&appid=f959a8a76641d391e165602072fb2790`)
            if (response.status == 200) {
                response.json().then(data => {
                    const info=data
                    result.innerHTML =
                        `
                         <div class="container d-flex justify-content-center bg-blue text-light mt-2">
                            <div class="card bg-primary text-light" style="width: 18rem;">
                                  <img src="https://static.vecteezy.com/system/resources/thumbnails/053/366/642/small_2x/weather-forecast-rgb-color-icon-various-weather-patterns-changing-atmospheric-conditions-meteorology-icon-isolated-illustration-simple-filled-line-drawing-editable-stroke-vector.jpg" class="card-img-top" height="250px" alt="...">
                                <div class="card-body">
                                 <h3 class="card-title fst-italic">${info.name}</h3>
                                 <p>Temperature:  ${info.main.temp}</p>
                                 <p>Weather Condition:  ${info.weather[0].description}</p>
                                 <p>Humidity:  ${info.main.humidity}</p>
                                 <p>WindSpeed:  ${info.wind.speed}</p>
                             
                                </div>
                            </div>
                        </div>
                    `
                })
            }else{alert(`not Valid`)}
        }
    }
</script>
